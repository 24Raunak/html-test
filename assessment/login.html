<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .search {
            color: white;
            border: none;
        }

        a {
            border-radius: 5px;
            text-decoration: none;
            color: white;
        }

        a:hover {
            background-color: lightsteelblue;
        }
    </style>
</head>

<body>
    <!-- header -->
    <nav class="navbar navbar-expand-lg bg-black navbar-dark">
        <div class="container-fluid">

            <!-- icon -->
            <a class="navbar-brand" href="index.html"><i class="fa-brands fa-amazon fs-1"></i></a>

            <!-- location -->
            <a class="navbar-brand " href="#"><i class="fa-solid fa-location-dot fs-4"></i>India</a>

            <!-- search bar -->
            <form class="d-flex mx-auto w-50 search" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-success search" type="submit"><i
                        class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <!-- log in -->
            <a class="navbar-brand bg-success p-1" href="/assessment/login.html">Log in</a>

            <!-- sign up -->
            <a class="navbar-brand bg-success p-1" href="#">Sign up</a>

            <!-- language -->
            <li class="nav-item dropdown list-unstyled text-light pe-3 me-3">
                <a class="nav-link dropdown-toggle fs-5" href="#" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="fa-solid fa-flag-usa"></i> EN
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">English-EN</a></li>
                    <li><a class="dropdown-item" href="#">Hindi-IN</a></li>
                </ul>
            </li>

            <!-- cart -->
            <li class="nav-item text-light list-unstyled p-1 me-3">
                <a class="nav-link fs-5" href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </li>

        </div>
    </nav>

    <main>

        <div class="card text-center" style="width: 25rem; margin: auto;">
            <div class="card-header">
                Sign Up
            </div>

            <div class="card-body">
                <form>
                    <!-- Email -->
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>

                    <!-- Password -->
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                </form>
            </div>

            <div class="card-footer text-body-secondary">
                <a href="#" class="text-black">Forgot Password?</a>
            </div>
        </div>


        <nav class="navbar navbar-expand-lg bg-black navbar-dark fixed-bottom">
            <div class="container-fluid">

                <!-- icon -->
                <a class="navbar-brand fs-6" href="#">Get to know us</a>

                <!-- location -->
                <a class="navbar-brand fs-6" href="#">Make money with us</a>

                <!-- location -->
                <a class="navbar-brand fs-6" href="#">Amazon Payment Products</a>

                <!-- location -->
                <a class="navbar-brand fs-6" href="#">Let us help you</a>

            </div>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
