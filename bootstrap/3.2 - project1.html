<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .volume {
            color: blue;
            background-color: blue;
        }
    </style>
</head>

<!-- Making a bootstrap webpage using bootstrap custom code -->

<body class="bg-success bg-gradient text-white">

    <nav class="navbar navbar-expand-lg bg-black navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">myMusic</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Browse</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Library</a>
                    </li>
                    <li class="nav-item dropdown">
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-lg">
        <div class="row">
            <div class="col-md-6">
                <h1 class="pt-5">Music</h1>
                <h3>Listen to your favourite music</h3>

                <button class="btn btn-success mt-5 bg-dark text-warning">Listen here</button>
            </div>

            <div class="col-md-4">
                <img class="img-fluid"
                    src="https://images.unsplash.com/photo-1485579149621-3123dd979885?q=80&w=1331&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
        </div>
    </div>

    <div class="container-lg mt-5">
        <h1>Albums</h1>
        <div class="row">
            <div class="col-md-3">
                <div class="card bg-info" style="">
                    <img class="card-img-top"
                        src="https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?q=80&w=1178&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Card image cap">
                    <div class="card-body">
                        <p class="card-text text-center text">DJ Mix</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info" style="">
                    <img class="card-img-top"
                        src="https://images.unsplash.com/photo-1564186763535-ebb21ef5277f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Card image cap">
                    <div class="card-body">
                        <p class="card-text text-center">Guitar Mix</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info" style="">
                    <img class="card-img-top"
                        src="https://images.unsplash.com/photo-1476136236990-838240be4859?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Card image cap">
                    <div class="card-body">
                        <p class="card-text text-center">Solo</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info" style="">
                    <img class="card-img-top"
                        src="https://images.unsplash.com/photo-1527261834078-9b37d35a4a32?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Card image cap">
                    <div class="card-body">
                        <p class="card-text text-center">Others</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-lg">
        <h2>Playlist</h2>
        <div class="row">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between bg-secondary text-white">
                    <span>⚡︎ Workout Mix</span>
                    <span>𝄞 32 Songs</span>
                </li>
                <li class="list-group-item d-flex justify-content-between bg-secondary text-white">
                    <span>⚡︎ Travel</span>
                    <span>𝄞 12 Songs</span>
                </li>
                <li class="list-group-item d-flex justify-content-between bg-secondary text-white">
                    <span>⚡︎ Hiking</span>
                    <span>𝄞 16 Songs</span>
                </li>
            </ul>
        </div>
    </div>

    <div class="container-fluid bg-black p-3 mt-5">
        <div class="row">
            <div class="col-md-4 d-flex flex-column justify-content-between">
                <span><b>Midnight Beats</b></span>
                <span class="text-secondary">DJ Nova</span>
            </div>
            <div class="col-md-4">
                <div class="d-flex flex-column justify-content-between text-center">
                    <span>
                        <button class="btn btn-primary"><i class="fa-solid fa-backward"></i></button>
                        <button class="btn btn-primary"><i class="fa-solid fa-play"></i></button>
                        <button class="btn btn-primary"><i class="fa-solid fa-forward"></i></button>
                    </span>
                    <span>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 75%" aria-valuenow="75"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </span>
                </div>
            </div>
            <div class="col-md-4 text-end">
                <span>🔊</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
