<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 12 - Rotating Navigation</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="container" class="container">
        <nav id="nav" class="side">
            <button id="open">Open</button>
            <button id="close" style="display:none">Close</button>
        </nav>

        <div id="content">
            <h1>Rotating Navigation Demo</h1>
            <p>Click open to see the rotation effect.</p>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('open'), closeBtn = document.getElementById('close'), container = document.getElementById('container'), nav = document.getElementById('nav');
        openBtn.addEventListener('click', () => { container.style.transform = 'rotate(-10deg) translateX(150px)'; nav.style.transform = 'translateX(0)'; openBtn.style.display = 'none'; closeBtn.style.display = 'inline-block' });
        closeBtn.addEventListener('click', () => { container.style.transform = ''; nav.style.transform = 'translateX(-100%)'; closeBtn.style.display = 'none'; openBtn.style.display = 'inline-block' });
    </script>
</body>

</html>
