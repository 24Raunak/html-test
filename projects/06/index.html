<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div id="box">
        <h1>Welcome back</h1>
        <div id="google">
        <button><img src="google.png" height="20"><span>Log in with Google</span></button><br><br><hr id="hrleft">
        </div>
        <div id="apple">
        <button id="button2"><img src="apple.png" height="20"><span>Log in with Apple</span></button><br><br><hr id="hrright">
        <label id="email">Email</label><br>
        <input type="email" placeholder="Enter your email"><br><br>
        <label id="password">Password</label><br>
        <input type="password" placeholder="********"><br><br>
        <input type="checkbox"><span class="remember">Remember Me</span><span id="forgot">Forgot Password?</span><br><br>
        <button id="sign">Sign in to your account</button><br><br>
        <span class="remember">Don't have an account yet?</span><span id="signup">Sign up here</span>
        </div>
    </div>
</body>
</html>
